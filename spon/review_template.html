<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Screening review</title>
<style>
  :root {
    --bg: #0e1117;
    --elev: #171c27;
    --text: #e7edf5;
    --text-soft: #d5dce8;
    --muted: #8f98aa;
    --faint: #6f788a;
    --line: rgba(255, 255, 255, 0.07);
    --input: #10141c;
    --pill: #222836;
    --pill-on: #f2f4f8;
    --pill-on-text: #15181e;
    --row-on: #222a38;
    --row-hover: #1a2130;
    --chip: #243044;
    --chip-text: #b7d0ff;
    --cleared: #3dce84;
    --cleared-bg: #143524;
    --review: #e6c35a;
    --review-bg: #3a3114;
    --same: #f0927c;
    --same-bg: #3c221c;
    --bar-g: #2fbf71;
    --bar-c: #e15d4f;
    --bar-a: #e0b03c;
    --bar-track: #222836;
    --ghost: #3c4558;
    --lavender: #d5e0ff;
    --lavender-text: #1c2433;
    --blue: #4c6ef5;
    --shadow: 0 0 0 1px rgba(255, 255, 255, 0.03);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f5f8;
    --elev: #ffffff;
    --text: #1a1f29;
    --text-soft: #243040;
    --muted: #5c6778;
    --faint: #6d788a;
    --line: rgba(20, 28, 45, 0.1);
    --input: #f7f8fb;
    --pill: #e6eaf1;
    --pill-on: #1c2433;
    --pill-on-text: #f7f8fb;
    --row-on: #e7ecf6;
    --row-hover: #eef1f6;
    --chip: #e4ecfb;
    --chip-text: #27407a;
    --cleared: #0f7a45;
    --cleared-bg: #d9f5e6;
    --review: #8a6a10;
    --review-bg: #f8efd0;
    --same: #a33b28;
    --same-bg: #fde4de;
    --bar-track: #e1e5ee;
    --ghost: #c5ccd8;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", "Liberation Sans", "DejaVu Sans", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid #8eabff; outline-offset: 2px; }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px 18px 12px;
    min-height: 0;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex: none; }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.02em; }
  .mgmt { color: var(--muted); font-size: 14px; }
  .meta {
    color: var(--faint);
    font-size: 12.5px;
    min-width: 0;
    max-width: min(640px, 48vw);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .actions { display: flex; gap: 8px; align-items: center; flex: none; }
  .btn {
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13.5px;
    border: 1px solid transparent;
    background: transparent;
    line-height: 1.2;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn.ghost { border-color: var(--ghost); color: var(--text); }
  .btn.lavender { background: var(--lavender); color: var(--lavender-text); font-weight: 650; }
  .btn.blue { background: var(--blue); color: white; font-weight: 650; }
  .btn.active { box-shadow: 0 0 0 2px #9db4ff; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--ghost); background: var(--elev); color: var(--text);
    display: grid; place-items: center; padding: 0;
  }
  :root:not([data-theme="light"]) .sun { display: none; }
  :root[data-theme="light"] .moon { display: none; }
  .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; flex: none; }
  .stat {
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px 12px;
    min-height: 86px;
    box-shadow: var(--shadow);
  }
  .stat b {
    display: block;
    font-size: 26px;
    font-weight: 640;
    letter-spacing: -0.03em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--bar-track); flex: none; }
  .bar i { display: block; height: 100%; }
  .bar .g { background: var(--bar-g); }
  .bar .c { background: var(--bar-c); }
  .bar .a { background: var(--bar-a); }
  .toolbar { display: flex; gap: 12px; align-items: center; flex: none; }
  #q {
    flex: 1.1;
    min-width: 200px;
    background: var(--input);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    outline: none;
  }
  .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chip-btn {
    background: var(--pill);
    color: var(--text);
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
  }
  .chip-btn.on { background: var(--pill-on); color: var(--pill-on-text); font-weight: 650; }
  select.reason {
    background: var(--pill);
    color: var(--text);
    border: 0;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 14px; }
  .list-wrap, #detail { min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #343c4e transparent; }
  .count { color: var(--faint); font-size: 12px; margin: 0 0 6px; }
  .hit {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 8px;
    padding: 9px 10px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 8px;
    color: inherit;
  }
  .hit .name { font-weight: 650; font-size: 14px; overflow-wrap: anywhere; }
  .hit .sub { grid-column: 1 / -1; color: var(--muted); font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
  .hit.on { background: var(--row-on); }
  .hit:hover { background: var(--row-hover); }
  .hit .mark { color: var(--review); font-weight: 650; }
  .badge {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge.cleared { background: var(--cleared-bg); color: var(--cleared); }
  .badge.review { background: var(--review-bg); color: var(--review); }
  .badge.same { background: var(--same-bg); color: var(--same); }
  .stack { display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .code { font-size: 12.5px; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
  .spacer { flex: 1; }
  .meta-line { font-size: 12.5px; color: var(--faint); }
  .reason { margin: 12px 0; font-size: 14.5px; line-height: 1.5; color: var(--text-soft); }
  .idrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
  .quiet { color: var(--muted); }
  .card {
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  ol.steps { margin: 0; padding-left: 1.25em; }
  ol.steps li { margin: 3px 0; font-size: 14px; }
  .screened { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .kv { display: grid; grid-template-columns: 148px minmax(0, 1fr); }
  .kv .k, .kv .v { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .kv .k { color: var(--muted); }
  .kv .v { min-width: 0; overflow-wrap: anywhere; }
  .chip {
    display: inline-block;
    background: var(--chip);
    color: var(--chip-text);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 12px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    margin: 2px 4px 2px 0;
  }
  .dash { color: var(--faint); }
  .person-head { margin-top: 8px; font-size: 12px; color: var(--faint); font-weight: 650; }
  .pill-safety {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--review); background: var(--review-bg); border-radius: 999px; padding: 3px 8px;
  }
  .callout { border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .callout.bad { background: var(--same-bg); color: var(--same); }
  .callout.warn { background: var(--review-bg); color: var(--review); }
  .callout.ok { background: var(--cleared-bg); color: var(--cleared); }
  .model-line { margin: 0; font-size: 13px; }
  .empty { color: var(--muted); padding: 24px 8px; }
  textarea {
    width: 100%;
    margin-top: 6px;
    background: var(--input);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    resize: vertical;
  }
  .note-label { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .ov-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .ov-choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .ov-choices button.on { box-shadow: 0 0 0 2px var(--text); }
  noscript { display: block; padding: 24px; }
  @media (max-width: 1100px) {
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    html, body { height: auto; overflow: auto; }
    #app { height: auto; }
    header { flex-wrap: wrap; }
    main { grid-template-columns: 1fr; }
    .list-wrap { max-height: 46vh; }
    .compare { grid-template-columns: 1fr; }
    .toolbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<noscript>This review page needs JavaScript. It still runs only on your machine.</noscript>
<div id="app">
  <header>
    <div class="brand">
      <h1>Screening review</h1>
      <span class="mgmt">Management</span>
      <span class="meta" id="meta"></span>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost" id="mode-edit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Edit hit list
      </button>
      <button type="button" class="btn lavender active" id="mode-review">Decision review</button>
      <button type="button" class="btn blue" id="mode-staff">Staff check
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="icon-btn" id="theme" aria-label="Toggle colour theme">
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <section class="stats" id="stats"></section>
  <div class="bar" id="bar" aria-hidden="true"></div>
  <section class="toolbar">
    <input id="q" type="search" placeholder="Search name, hit, alert or customer ID (/)" autocomplete="off">
    <div class="chips">
      <button type="button" class="chip-btn on" data-chip="all">All</button>
      <button type="button" class="chip-btn" data-chip="cleared">Cleared</button>
      <button type="button" class="chip-btn" data-chip="same">Same entity</button>
      <button type="button" class="chip-btn" data-chip="review">Review</button>
      <select class="reason" id="reason" aria-label="All reasons"><option value="">All reasons</option></select>
      <label class="check"><input type="checkbox" id="f-practice"> practice labels</label>
      <label class="check"><input type="checkbox" id="f-safety"> held by safety net</label>
      <label class="check"><input type="checkbox" id="f-overrides"> my overrides</label>
    </div>
  </section>
  <main>
    <div class="list-wrap">
      <p class="count" id="count"></p>
      <div id="list"></div>
    </div>
    <div id="detail"></div>
  </main>
</div>
<script id="payload" type="application/json">__SPON_PAYLOAD__</script>
<script>
(function () {
  var PAYLOAD;
  try {
    PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
  } catch (err) {
    document.body.textContent = "Could not read the embedded review data.";
    return;
  }
  var hits = PAYLOAD.hits || [];
  var meta = PAYLOAD.meta || {};
  var overrides = {};
  var selected = hits.length ? hits[0].hit_id : null;
  var query = "";
  var chip = "all";
  var reason = "";
  var mode = "review";

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }
  function badgeClass(decision) {
    if (decision === "DIFFERENT_ENTITY") return "cleared";
    if (decision === "SAME_ENTITY") return "same";
    return "review";
  }
  function badgeText(decision) {
    if (decision === "DIFFERENT_ENTITY") return "Cleared";
    if (decision === "SAME_ENTITY") return "Same entity";
    if (decision === "REVIEW") return "Review";
    return decision || "—";
  }
  function shownDecision(hit) {
    var ov = overrides[hit.hit_id];
    return (ov && ov.decision) || hit.decision;
  }
  function chipList(ids) {
    return (ids || []).filter(Boolean).map(function (id) {
      return '<span class="chip">' + esc(id) + "</span>";
    }).join("");
  }
  function dash() { return '<span class="dash">—</span>'; }
  function lines(items) {
    if (!items || !items.length) return dash();
    return items.map(function (item) { return "<div>" + esc(item) + "</div>"; }).join("");
  }

  function renderStats() {
    var n = hits.length;
    var cleared = 0, same = 0, review = 0, safety = 0, labeled = 0, right = 0, unsafe = 0;
    hits.forEach(function (hit) {
      if (hit.decision === "DIFFERENT_ENTITY") cleared += 1;
      else if (hit.decision === "SAME_ENTITY") same += 1;
      else if (hit.decision === "REVIEW") review += 1;
      if (hit.safety_net) safety += 1;
      if (hit.practice) {
        labeled += 1;
        if (hit.practice.decision === hit.decision) right += 1;
        if (hit.practice.decision !== "DIFFERENT_ENTITY" && hit.decision === "DIFFERENT_ENTITY") unsafe += 1;
      }
    });
    var pct = n ? Math.round(100 * cleared / n) : 0;
    var practiceBig = labeled ? (right + "/" + labeled) : "—";
    var practiceSub = labeled ? ("practice labels right · " + unsafe + " unsafe clears") : "no practice labels";
    var cards = [
      [String(n), "hits decided"],
      [String(cleared), "cleared automatically (" + pct + "%)"],
      [String(same), "same entity → compliance"],
      [String(review), "sent to an analyst"],
      [practiceBig, practiceSub],
      [String(safety), "held by the safety net"]
    ];
    document.getElementById("stats").innerHTML = cards.map(function (card) {
      return "<article class=\"stat\"><b>" + esc(card[0]) + "</b><span>" + esc(card[1]) + "</span></article>";
    }).join("");
    function width(count) { return n ? (100 * count / n) + "%" : "0"; }
    document.getElementById("bar").innerHTML =
      '<i class="g" style="width:' + width(cleared) + '"></i>' +
      '<i class="c" style="width:' + width(same) + '"></i>' +
      '<i class="a" style="width:' + width(review) + '"></i>';
    var metaEl = document.getElementById("meta");
    metaEl.textContent = n + " hits · " + (meta.data_dir || "data folder not set") + " · built " + (meta.built || "");
    metaEl.title = meta.data_dir || "";
  }

  function matches(hit) {
    if (query && hit.search.indexOf(query) === -1) return false;
    var shown = shownDecision(hit);
    if (chip === "cleared" && shown !== "DIFFERENT_ENTITY") return false;
    if (chip === "same" && shown !== "SAME_ENTITY") return false;
    if (chip === "review" && shown !== "REVIEW") return false;
    if (reason && hit.reason_code !== reason) return false;
    if (document.getElementById("f-practice").checked && !hit.practice) return false;
    if (document.getElementById("f-safety").checked && !hit.safety_net) return false;
    if (document.getElementById("f-overrides").checked && !overrides[hit.hit_id]) return false;
    return true;
  }

  function renderList() {
    var visible = hits.filter(matches);
    var still = visible.some(function (hit) { return hit.hit_id === selected; });
    if (!still) selected = visible.length ? visible[0].hit_id : null;
    document.getElementById("count").textContent = visible.length + " of " + hits.length + " hits";
    var html = visible.map(function (hit) {
      var shown = shownDecision(hit);
      var sub = [hit.hit_name, hit.category, hit.reason_code].filter(Boolean).join(" · ");
      var extra = "";
      if (overrides[hit.hit_id]) extra += ' <span class="mark">override</span>';
      if (hit.practice && hit.practice.decision !== "DIFFERENT_ENTITY" && hit.decision === "DIFFERENT_ENTITY") {
        extra += ' <span class="mark">unsafe</span>';
      }
      return '<button type="button" class="hit' + (hit.hit_id === selected ? " on" : "") + '" data-id="' + esc(hit.hit_id) + '">' +
        '<span class="name">' + esc(hit.list_name) + "</span>" +
        '<span class="badge ' + badgeClass(shown) + '">' + esc(badgeText(shown)) + "</span>" +
        '<span class="sub">' + esc(sub) + extra + "</span></button>";
    }).join("");
    document.getElementById("list").innerHTML = html || '<div class="empty">No hits match these filters.</div>';
    if (!still) renderDetail();
  }

  function kv(pairs) {
    return '<div class="kv">' + pairs.map(function (pair) {
      return '<div class="k">' + esc(pair[0]) + '</div><div class="v">' + pair[1] + "</div>";
    }).join("") + "</div>";
  }
  function personBlock(person, index, total) {
    var head = total > 1 ? '<div class="person-head">Person ' + (index + 1) + "</div>" : "";
    var dob = person.dob
      ? "<div>" + esc(person.dob) + (person.dob_label ? ' <span class="quiet">(' + esc(person.dob_label) + ")</span>" : "") + "</div>" +
        (person.dob_ids && person.dob_ids.length ? '<div>' + chipList(person.dob_ids) + "</div>" : "")
      : dash();
    var verified = person.verified_name
      ? "<div>" + esc(person.verified_name) + "</div>" + (person.verified_name_id ? "<div>" + chipList([person.verified_name_id]) + "</div>" : "")
      : dash();
    var countries = (person.countries && person.countries.length)
      ? person.countries.map(function (c) {
          return "<div>" + esc(c.country) + "</div>" + (c.sources && c.sources.length ? "<div>" + chipList(c.sources) + "</div>" : "");
        }).join("")
      : dash();
    return head + kv([
      ["Records", person.records && person.records.length ? chipList(person.records) : dash()],
      ["Names on record", lines(person.names)],
      ["Verified legal name", verified],
      ["Date of birth", dob],
      ["Countries", countries]
    ]);
  }
  function watchBlock(hit) {
    var w = hit.watchlist || {};
    var countries = (w.countries && w.countries.length) ? esc(w.countries.join(", ")) : dash();
    var pairs = [
      ["Names", lines(w.names)],
      ["Listing", w.listing ? esc(w.listing) : dash()],
      ["Date of birth", w.dob ? esc(w.dob) : dash()],
      ["Countries", countries],
      ["Earliest dated report", w.earliest_report ? esc(w.earliest_report) : dash()]
    ];
    if (w.deceased) pairs.push(["Died", esc(w.deceased)]);
    return kv(pairs);
  }
  function practiceStrip(hit) {
    if (!hit.practice) return "";
    var unsafe = hit.practice.decision !== "DIFFERENT_ENTITY" && hit.decision === "DIFFERENT_ENTITY";
    var same = hit.practice.decision === hit.decision;
    if (mode !== "staff" && same && !unsafe) return "";
    var label = badgeText(hit.practice.decision) + (hit.practice.reason_code ? " · " + hit.practice.reason_code : "");
    if (unsafe) {
      return '<div class="callout bad">Unsafe clearance. Practice label says ' + esc(label) + ", and the model cleared the hit.</div>";
    }
    if (!same) {
      return '<div class="callout warn">Practice label says ' + esc(label) + ". Model says " + esc(badgeText(hit.decision)) + ".</div>";
    }
    return '<div class="callout ok">Practice label matches: ' + esc(label) + ".</div>";
  }
  function renderDetail() {
    var hit = hits.filter(function (item) { return item.hit_id === selected; })[0];
    var root = document.getElementById("detail");
    if (!hit) {
      root.innerHTML = '<div class="empty">No hit selected.</div>';
      return;
    }
    var shown = shownDecision(hit);
    var ov = overrides[hit.hit_id];
    var modelLine = "";
    if (ov) {
      modelLine = '<p class="model-line quiet">Model: ' + esc(badgeText(hit.decision)) + " · " + esc(hit.reason_code) +
        (ov.note ? " · " + esc(ov.note) : "") + "</p>";
    }
    var steps = (hit.found_steps || []).map(function (step) { return "<li>" + esc(step) + "</li>"; }).join("");
    if (!steps) steps = "<li>Join output was not next to the decisions, so the path is not available.</li>";
    var people = (hit.persons && hit.persons.length)
      ? hit.persons.map(function (person, i) { return personBlock(person, i, hit.persons.length); }).join("")
      : '<p class="quiet">No customer record was found for this alert.</p>';
    var record = hit.customer_record_id ? chipList([hit.customer_record_id]) : '<span class="dash">none</span>';
    var evidence = (hit.evidence && hit.evidence.length) ? chipList(hit.evidence) : '<span class="dash">none</span>';
    var choices = [
      ["DIFFERENT_ENTITY", "Cleared"],
      ["SAME_ENTITY", "Same entity"],
      ["REVIEW", "Review"]
    ].map(function (item) {
      var on = ov && ov.decision === item[0] ? " on" : "";
      return '<button type="button" class="badge ' + badgeClass(item[0]) + on + '" data-ov="' + item[0] + '">' + item[1] + "</button>";
    }).join("");
    var note = ov && ov.note ? ov.note : "";
    root.innerHTML =
      '<div class="stack">' +
        '<div class="top">' +
          '<span class="badge ' + badgeClass(shown) + '">' + esc(badgeText(shown)) + "</span>" +
          '<span class="code">' + esc(hit.reason_code) + "</span>" +
          (hit.safety_net ? '<span class="pill-safety">Safety net</span>' : "") +
          '<span class="spacer"></span>' +
          '<span class="meta-line">' + esc(hit.hit_id) + " · alert " + esc(hit.alert_id) + " · " +
            hit.n_on_alert + " hit(s) · screened " + esc(hit.screened_on || "—") + "</span>" +
        "</div>" +
        modelLine +
        '<p class="reason">' + esc(hit.reason) + "</p>" +
        practiceStrip(hit) +
        '<div class="idrow"><span class="quiet">Customer record</span>' + record +
          '<span class="quiet">Evidence</span>' + evidence + "</div>" +
        '<section class="card">' +
          '<h2 class="kicker">How the customer was found</h2>' +
          "<ol class=\"steps\">" + steps + "</ol>" +
          (hit.screened_line ? '<p class="screened">' + esc(hit.screened_line) + "</p>" : "") +
        "</section>" +
        '<div class="compare">' +
          '<section class="card"><h2 class="kicker">Customer</h2>' + people + "</section>" +
          '<section class="card"><h2 class="kicker">Watchlist hit</h2>' + watchBlock(hit) + "</section>" +
        "</div>" +
        '<section class="card override">' +
          '<h2 class="kicker">My override</h2>' +
          '<p class="quiet">Saved on this machine, in overrides.json. The totals above stay on the model.</p>' +
          '<div class="ov-choices">' + choices + "</div>" +
          '<label class="note-label">Note<textarea id="note" rows="3" placeholder="Why you are changing this decision.">' +
            esc(note) + "</textarea></label>" +
          '<div class="ov-actions">' +
            '<button type="button" class="btn blue" id="save-ov">Save note</button>' +
            '<button type="button" class="btn ghost" id="clear-ov">Clear override</button>' +
            '<span class="quiet" id="save-state"></span>' +
          "</div>" +
        "</section>" +
      "</div>";
  }

  function persist() {
    var state = document.getElementById("save-state");
    fetch("/overrides", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(overrides)
    }).then(function (res) {
      if (!res.ok) throw new Error("save failed");
      if (state) state.textContent = "Saved to overrides.json on this machine.";
    }).catch(function () {
      try { localStorage.setItem("spon-overrides", JSON.stringify(overrides)); } catch (err) {}
      if (state) state.textContent = "Saved in this browser only. Open the local review server to write overrides.json.";
    });
  }
  function choose(decision) {
    if (!selected) return;
    var note = document.getElementById("note");
    var prev = overrides[selected] || {};
    overrides[selected] = {
      decision: decision,
      note: note ? note.value : (prev.note || ""),
      updated: new Date().toISOString().slice(0, 19)
    };
    renderList();
    renderDetail();
    persist();
  }
  function saveNote() {
    if (!selected) return;
    var note = document.getElementById("note");
    var prev = overrides[selected];
    if (!prev) {
      var state = document.getElementById("save-state");
      if (state) state.textContent = "Pick Cleared, Same entity, or Review first.";
      return;
    }
    prev.note = note ? note.value : "";
    prev.updated = new Date().toISOString().slice(0, 19);
    renderList();
    renderDetail();
    persist();
  }
  function clearOverride() {
    if (!selected || !overrides[selected]) return;
    delete overrides[selected];
    renderList();
    renderDetail();
    persist();
  }

  document.getElementById("list").addEventListener("click", function (event) {
    var row = event.target.closest(".hit");
    if (!row) return;
    selected = row.getAttribute("data-id");
    renderList();
    renderDetail();
  });
  document.getElementById("detail").addEventListener("click", function (event) {
    var choice = event.target.closest("[data-ov]");
    if (choice) { choose(choice.getAttribute("data-ov")); return; }
    if (event.target.id === "save-ov") saveNote();
    if (event.target.id === "clear-ov") clearOverride();
  });
  document.getElementById("q").addEventListener("input", function () {
    query = document.getElementById("q").value.trim().toLowerCase();
    renderList();
  });
  document.querySelectorAll("[data-chip]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      chip = btn.getAttribute("data-chip");
      document.querySelectorAll("[data-chip]").forEach(function (other) {
        other.classList.toggle("on", other === btn);
      });
      renderList();
    });
  });
  ["f-practice", "f-safety", "f-overrides"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", renderList);
  });
  document.getElementById("reason").addEventListener("change", function () {
    reason = document.getElementById("reason").value;
    renderList();
  });
  document.getElementById("mode-review").addEventListener("click", function () {
    mode = "review";
    document.getElementById("f-practice").checked = false;
    document.getElementById("mode-review").classList.add("active");
    document.getElementById("mode-staff").classList.remove("active");
    renderList();
    renderDetail();
  });
  document.getElementById("mode-staff").addEventListener("click", function () {
    mode = "staff";
    document.getElementById("f-practice").checked = true;
    document.getElementById("mode-staff").classList.add("active");
    document.getElementById("mode-review").classList.remove("active");
    renderList();
    renderDetail();
  });
  document.getElementById("mode-edit").addEventListener("click", function () {
    var box = document.querySelector(".override");
    if (box) box.scrollIntoView({ behavior: "smooth", block: "start" });
    var note = document.getElementById("note");
    if (note) note.focus();
  });
  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("spon-theme", next); } catch (err) {}
  });
  document.addEventListener("keydown", function (event) {
    var tag = document.activeElement && document.activeElement.tagName;
    if (event.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") {
      event.preventDefault();
      document.getElementById("q").focus();
    }
    if ((event.key === "ArrowDown" || event.key === "ArrowUp") && tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") {
      var visible = hits.filter(matches);
      var index = -1;
      visible.forEach(function (hit, i) { if (hit.hit_id === selected) index = i; });
      var next = event.key === "ArrowDown" ? Math.min(visible.length - 1, index + 1) : Math.max(0, index - 1);
      if (visible[next]) {
        selected = visible[next].hit_id;
        renderList();
        renderDetail();
        var el = document.querySelector(".hit.on");
        if (el) el.scrollIntoView({ block: "nearest" });
      }
      event.preventDefault();
    }
  });

  var codes = [];
  hits.forEach(function (hit) {
    if (hit.reason_code && codes.indexOf(hit.reason_code) === -1) codes.push(hit.reason_code);
  });
  codes.sort();
  var select = document.getElementById("reason");
  codes.forEach(function (code) {
    var option = document.createElement("option");
    option.value = code;
    option.textContent = code;
    select.appendChild(option);
  });
  try {
    if (localStorage.getItem("spon-theme") === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (err) {}
  renderStats();
  renderList();
  renderDetail();
  fetch("/overrides.json", { cache: "no-store" }).then(function (res) {
    if (!res.ok) throw new Error("no overrides");
    return res.json();
  }).then(function (data) {
    overrides = data || {};
    renderList();
    renderDetail();
  }).catch(function () {
    try { overrides = JSON.parse(localStorage.getItem("spon-overrides") || "{}"); } catch (err) { overrides = {}; }
    if (overrides && Object.keys(overrides).length) {
      renderList();
      renderDetail();
    }
  });
})();
</script>
</body>
</html>
